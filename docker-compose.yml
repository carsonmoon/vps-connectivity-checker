services:
  vps-check:
    # 优先用 ghcr 上的现成镜像（docker compose pull）；无网/私有化场景仍可本地 build
    image: ghcr.io/carsonmoon/vps-connectivity-checker:latest
    build: .
    container_name: vps-check
    # host 网络：容器直接用 NAS 的网络栈，天然继承家宽的 IPv4/IPv6 出口
    # （bridge 模式默认没有 IPv6，会导致 IPv6 检测全部假阴性）
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      - PORT=52000
